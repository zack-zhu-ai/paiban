<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>护理排班表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="排班">
<meta name="theme-color" content="#2f5d8a">
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --text:#1f2933; --muted:#6b7785; --line:#dde2e8; --line-strong:#bcc4ce;
  --primary:#2f5d8a; --primary-weak:#e7eef6;
  --red:#d32f2f; --red-weak:#fde4e1; --orange:#e67700; --orange-weak:#ffe3c2; --yellow:#f2c200; --yellow-weak:#fff3a0;
  --green:#2e7d32; --blue:#1a5fb4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--line-strong);background:#fff;color:var(--text);border-radius:8px;padding:7px 14px;min-height:40px;touch-action:manipulation;white-space:nowrap}
button:active{filter:brightness(.95)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.danger{color:var(--red);border-color:#efb3ad}
button.link{border:none;background:none;color:var(--primary);padding:2px 6px;min-height:0;text-decoration:underline}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
input,select,textarea{font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;min-height:40px;background:#fff;color:var(--text);max-width:100%}
input[type=number]{width:110px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sync-chip{font-size:13px;min-height:30px;padding:3px 10px;border-radius:999px;font-weight:600}
.sync-chip.grey{color:#6b7785;background:#f1f3f5;border-color:#dde2e8}
.sync-chip.green{color:var(--green);background:#e8f5e9;border-color:#b9dfbb}
.sync-chip.blue{color:var(--blue);background:#e6effb;border-color:#b8cdef}
.sync-chip.orange{color:#b35c00;background:#fff1de;border-color:#f5cf9c}
.sync-chip.red{color:var(--red);background:var(--red-weak);border-color:#f2b0a9}
.weekbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px 6px}
#weekLabel{font-weight:700;font-size:17px;margin-left:4px}
.tag-now{background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 6px;margin-left:6px;vertical-align:2px}
#periodInfo{padding:2px 16px 10px;display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
.pi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pi.hol{background:#e9f6f3;border-color:#bfe3da}
.pi.none{color:var(--muted)}
.pi.alert{background:var(--red-weak);border-color:#f2b0a9;color:var(--red);font-weight:600}
main{padding:0 16px 12px}
.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px);min-height:260px}
table#grid{border-collapse:separate;border-spacing:0;width:100%;min-width:740px;table-layout:fixed}
#grid th,#grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;padding:0}
#grid thead th{background:#f6f8fa;padding:6px 2px;font-weight:600;position:sticky;top:0;z-index:3}
#grid th.name{position:sticky;left:0;z-index:2;background:#fff;padding:4px 2px}
#grid thead th.name-h{position:sticky;left:0;top:0;z-index:4;background:#f6f8fa}
.dnum{font-size:16px}
.wd{font-size:13px;color:var(--muted);font-weight:500}
.issues{font-size:12px;font-weight:700;margin-top:1px}
#grid th.day-h.holiday{background:#e4f4f0}
#grid th.day-h.none{background:#f1f2f4;color:#9aa3ae}
#grid th.warn-red{background:var(--red-weak)}
#grid th.warn-red .issues{color:var(--red)}
#grid th.warn-orange{background:var(--orange-weak)}
#grid th.warn-orange .issues{color:#b35c00}
#grid th.today{box-shadow:inset 0 -3px 0 var(--primary)}
#grid th.today .dnum{color:var(--primary)}
.tag-legal{background:var(--red);color:#fff;font-size:11px;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:2px}
.tag-temp{background:#eceff3;color:#6b7785;font-size:11px;border-radius:4px;padding:0 4px;margin-left:3px;font-weight:500;vertical-align:2px}
.tag-hol{font-size:11px;color:#00695c}
.nm{font-size:16px;font-weight:700}
#grid th.name.warn-orange{background:var(--orange-weak)}
#grid th.name.warn-yellow{background:var(--yellow-weak)}
.b{display:inline-block;font-size:11px;border-radius:4px;padding:0 4px;margin:2px 1px 0;font-weight:700;line-height:17px}
.b-orange{background:var(--orange);color:#fff}
.b-yellow{background:var(--yellow);color:#3b2f00}
#grid td.c{height:62px;cursor:pointer;background:#fff}
#grid td.c:active{filter:brightness(.93)}
.sh{font-size:22px;font-weight:700;line-height:1.1;min-height:24px}
.mk{font-size:11px;margin-top:3px;display:flex;gap:3px;justify-content:center;min-height:0}
.mj,.mx{border-radius:4px;padding:0 3px;font-weight:700;line-height:16px}
.mj{color:#b3261e;background:#fde7e4}
.mx{color:#1a5fb4;background:#e1ecfb}
.s-bai{background:#fff7dc !important;color:#8a6400}
.s-zhu{background:#e2efff !important;color:#0b4f9c}
.s-ye{background:#ebe4fb !important;color:#4b2a9b}
.s-xia{background:#f1f2f4 !important;color:#6b7280}
.s-xiu{color:#9aa3ae}
.s-zhi{background:#d9f1ec !important;color:#00695c}
#grid td.hol{background:#f5fbf9}
#grid td.off{background:repeating-linear-gradient(45deg,#f4f5f7,#f4f5f7 6px,#eceef1 6px,#eceef1 12px);cursor:not-allowed}
#grid td.locked{background:repeating-linear-gradient(45deg,#fdf0ef,#fdf0ef 6px,#f8e1df 6px,#f8e1df 12px) !important;cursor:not-allowed}
#grid tr.sealed th.name,#grid tr.sealed td{opacity:.45;filter:grayscale(1)}
#grid td.sum{background:#fafbfc}
.sn{font-size:19px;font-weight:700;line-height:1.15}
.sq{font-size:11px;color:var(--muted);line-height:1.3}
#grid td.bal{font-size:19px;font-weight:700;background:#fafbfc}
.neg{color:var(--red)}
.red{color:var(--red) !important}
.blue{color:var(--blue)}
.muted{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 16px 24px;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:4px}
.legend .sw{display:inline-block;min-width:22px;height:18px;border-radius:4px;text-align:center;font-weight:700;line-height:18px;border:1px solid var(--line)}
.welcome{padding:32px 24px;max-width:640px;margin:0 auto;line-height:1.9}
.welcome h2{margin:0 0 8px}
/* 弹窗 */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);gap:8px}
.modal-h h2{margin:0;font-size:18px}
.modal-h .x{border:none;font-size:28px;line-height:1;padding:2px 12px;background:none;color:var(--muted)}
.modal-b{padding:14px 18px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f.grow{flex:1;min-width:160px}
label.f input,label.f select{color:var(--text)}
.sec-t{font-weight:700;font-size:15px;margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.sec-t.first{border-top:none;margin-top:0;padding-top:0}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.err{color:var(--red);font-size:14px;font-weight:600;margin:6px 0;min-height:1em}
.warnbox{background:#fff4e0;border:1px solid #f5cf9c;color:#8a4b00;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 16px;cursor:pointer;min-height:40px;line-height:24px;background:#fff}
.seg label+label span{border-left:1px solid var(--line-strong)}
.seg input:checked+span{background:var(--primary);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns.end{justify-content:flex-end}
.btns-col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.tbl th{background:#f6f8fa;font-weight:600;position:sticky;top:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.total td{font-weight:700;background:#f8fafc}
.tbl tr.revoked td{color:#9aa3ae;text-decoration:line-through}
.tbl tr.revoked td.ops{text-decoration:none}
.tbl .dates{font-size:12px;color:var(--muted);letter-spacing:-.2px;word-break:break-word}
.scroll{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:4px 10px;border-radius:999px;background:#f3f5f8;border-color:var(--line)}
.dchip{display:inline-flex;align-items:center;gap:2px;background:#fdecea;border:1px solid #f4c3bd;border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.dchip button{border:none;background:none;min-height:28px;padding:0 6px;color:var(--red);font-size:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.prow.dragging{box-shadow:0 6px 18px rgba(0,0,0,.18);border-color:var(--primary);position:relative;z-index:2}
.prow .handle{font-size:22px;color:#9aa3ae;padding:4px 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.prow .pinfo{flex:1;min-width:0}
.prow .mv{min-width:42px;min-height:38px;font-size:17px;padding:2px 8px}
.prow .pinfo .small{font-size:12px;color:var(--muted)}
.plist.sealed .prow{background:#f5f6f8;color:#9aa3ae}
.tag{display:inline-block;font-size:12px;border-radius:5px;padding:0 6px;background:#eef2f6;color:#4a5563;margin-left:4px}
.tag.temp{background:#fff1de;color:#8a4b00}
/* 选班面板 */
.picker .modal{max-width:520px}
.pk-sub{font-size:14px;color:var(--muted);margin-bottom:10px}
.shift-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shift-btns.two{grid-template-columns:repeat(2,1fr)}
.shift-btns .sb{height:72px;font-size:28px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;background:#fff}
.shift-btns .sb small{font-size:11px;font-weight:500;opacity:.75}
.shift-btns .sb.on{outline:3px solid var(--primary);outline-offset:1px}
.mark-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mark-row .mt{min-width:92px;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:4px 10px}
.mark-row .mt b{font-size:18px}
.mark-row .mt small{font-size:11px;color:var(--muted)}
.mark-row .mt.on.m-j{background:#fde7e4;border-color:#e59a90;color:#b3261e}
.mark-row .mt.on.m-x{background:#e1ecfb;border-color:#98b6e6;color:#1a5fb4}
.mark-row .note{width:72px;text-align:center;font-size:18px}
.pk-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.pk-foot .sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chk input{width:20px;height:20px;min-height:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details{margin:8px 0;font-size:14px}
details summary{cursor:pointer;color:var(--primary)}
details ol{padding-left:20px;margin:8px 0;line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
@media (max-width:700px){
  .topbar{padding:8px 12px}
  .brand{font-size:18px}
  .actions button{padding:6px 10px;font-size:14px;min-height:36px}
  .weekbar,#periodInfo,main,.legend{padding-left:12px;padding-right:12px}
  .cmp{grid-template-columns:1fr}
  .shift-btns .sb{height:60px;font-size:24px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="appTitle">护理排班表</span><button id="syncChip" class="sync-chip grey">● 本地模式</button></div>
  <nav class="actions">
    <button class="primary" data-act="schedule">开始排班</button>
    <button data-act="people">人员</button>
    <button data-act="adjust">调整加班</button>
    <button data-act="field">外勤记录</button>
    <button data-act="legal">法定假加班费</button>
    <button data-act="night">夜班看板</button>
    <button data-act="exam">体检看板</button>
    <button data-act="export">导出Excel</button>
    <button data-act="settings">设置</button>
  </nav>
</header>
<section class="weekbar">
  <button id="prevWeek">◀ 上一周</button>
  <button id="thisWeek">本周</button>
  <button id="nextWeek">下一周 ▶</button>
  <input type="date" id="jumpDate" aria-label="跳转到日期">
  <span id="weekLabel"></span>
</section>
<section id="periodInfo"></section>
<main><div class="table-wrap" id="gridWrap"><table id="grid"></table></div></main>
<div class="legend">
  <span class="lg"><span class="sw s-bai">白</span>1班</span>
  <span class="lg"><span class="sw s-zhu">主</span>1班</span>
  <span class="lg"><span class="sw s-ye">夜</span>2班</span>
  <span class="lg"><span class="sw s-xia">下</span>0</span>
  <span class="lg"><span class="sw s-xiu">休</span>0</span>
  <span class="lg"><span class="sw s-zhi">值</span>公休全天3班</span>
  <span class="lg"><span class="sw" style="background:var(--red-weak)"></span>当天缺主班/夜班</span>
  <span class="lg"><span class="sw" style="background:var(--orange-weak)"></span>表头：当天主班或夜班超过1人；姓名：本周夜班不是1个</span>
  <span class="lg"><span class="sw" style="background:var(--yellow-weak)"></span>姓名：本周主班不是1个</span>
  <span class="lg"><span class="tag-legal">法</span>法定假</span>
  <span class="lg"><span class="tag-temp">临</span>临时人员</span>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ================= 常量 ================= */
const APP_VERSION = '1.0.1';
const GH_DEFAULT = { owner: 'zack-zhu-ai', repo: 'paiban-data', branch: 'main', path: 'data.json', token: '' };
const SHIFT_VALUE = { '白': 1, '主': 1, '夜': 2, '下': 0, '休': 0, '值': 3 };
const SHIFT_CLS = { '白': 'bai', '主': 'zhu', '夜': 'ye', '下': 'xia', '休': 'xiu', '值': 'zhi' };
const REGULAR_SHIFTS = ['白', '主', '夜', '下', '休'];
const HOLIDAY_SHIFTS = ['值', '休'];
const PAY_SHIFTS = ['白', '主', '夜', '值'];
const WEEKDAYS = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
const WD_SHORT = ['一', '二', '三', '四', '五', '六', '日'];
const FULL_WEEK_QUOTA = 5;
const LS = { data: 'paiban.data.v1', meta: 'paiban.meta.v1', gh: 'paiban.gh.v1', pref: 'paiban.pref.v1' };

/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function round1(n) { return Math.round(n * 10) / 10; }
function fmtNum(n) { n = round1(Number(n) || 0); return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function firstChar(s) { return Array.from(String(s || '').trim())[0] || ''; }
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('本机保存失败：' + e.message, true); return false; } }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isHalfStep(n) { return Number.isFinite(n) && Math.abs(n * 2 - Math.round(n * 2)) < 1e-9; }

const pad = n => String(n).padStart(2, '0');
function toKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromKey(k) { const a = k.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); }
function weekStart(k) { const d = fromKey(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return toKey(d); }
function weekdayIdx(k) { return (fromKey(k).getDay() + 6) % 7; }
function todayKey() { return toKey(new Date()); }
function rangeDays(a, b) { const out = []; for (let k = a; k <= b; k = addDays(k, 1)) out.push(k); return out; }
function maxK(a, b) { return a > b ? a : b; }
function minK(a, b) { return a < b ? a : b; }
function fmtMD(k) { const d = fromKey(k); return (d.getMonth() + 1) + '.' + d.getDate(); }
function fmtMDcn(k) { const d = fromKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtYMD(k) { return k.replace(/-/g, '.'); }
function fmtShort(k) { return k.slice(2); }
function monthRange(k) { const d = fromKey(k); return [toKey(new Date(d.getFullYear(), d.getMonth(), 1)), toKey(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; }
function hhmm(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return toKey(d) + ' ' + hhmm(d); }
function isValidKey(k) { return /^\d{4}-\d{2}-\d{2}$/.test(k || ''); }

let toastTimer = null;
function toast(msg, isErr) { const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (isErr ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'toast'; }, isErr ? 4200 : 2400); }

/* ================= 数据 ================= */
function emptyData() {
  return {
    version: 1, rev: 0, title: '护理排班表',
    people: [],        // {id,name,type:'resident'|'temp',sealed,sealedAt,initBalance,since}
    periods: [],       // {id,type:'regular'|'holiday',start,end,quota(公休假应上班次)}
    weekQuotas: {},    // 周一日期 -> 不完整周的满勤班次

function normalize(d) {

  if (!Array.isArray(d.rates) || !d.rates.length) d.rates = e.rates;

  d.periods.sort((a, b) => a.start < b.start ? -1 : 1);

/* ================= 计算 ================= */
function weekInfo(ws) {
  const days = [], types = [];
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); days.push(d); types.push(dayType(d)); }
  const regDays = days.filter((d, i) => types[i] === 'regular');
  const holDays = days.filter((d, i) => types[i] === 'holiday');
  const full = regDays.length === 7;
  let quota = null, needQuota = false;
  if (full) quota = FULL_WEEK_QUOTA;
  else if (regDays.length) {
    const q = D.weekQuotas[ws];
    if (q === undefined || q === null || q === '' || isNaN(Number(q))) needQuota = true; else quota = Number(q);
  }
  return { ws, days, types, regDays, holDays, full, quota, needQuota };
}
function personWeek(p, wi) {
  let total = 0, reg = 0, hol = 0, nights = 0, mains = 0;
  wi.days.forEach((d, i) => {
    const t = wi.types[i]; if (!t) return;
    const c = getCell(d, p.id); if (!c || !c.s) return;
    const v = SHIFT_VALUE[c.s] || 0; total += v;
    if (t === 'regular') { reg += v; if (c.s === '夜') nights++; if (c.s === '主') mains++; }
    else hol += v;

  return { total, reg, hol, nights, mains };
}
function holidayActual(p, pr) {

  for (const d in D.cells) { if (d < pr.start || d > pr.end) continue; const c = D.cells[d][p.id]; if (c && c.s) n += SHIFT_VALUE[c.s] || 0; }
  return n;
}
function personActiveWeek(p, ws) {

  if (p.sealed && p.sealedAt && ws > weekStart(p.sealedAt)) return false;

}
let ledgerCache = null;
function ledger() {
  if (ledgerCache && ledgerCache.v === VER) return ledgerCache;
  const weeks = new Set();
  D.periods.forEach(pr => { for (let w = weekStart(pr.start); w <= pr.end; w = addDays(w, 7)) weeks.add(w); });
  const wis = {}; weeks.forEach(w => { wis[w] = weekInfo(w); });
  const per = {};
  for (const p of D.people) {
    if (p.type !== 'resident') continue;
    const ev = [];
    for (const w in wis) {
      const wi = wis[w];
      if (!wi.regDays.length || wi.quota === null || !personActiveWeek(p, w)) continue;
      ev.push({ ws: w, amt: personWeek(p, wi).reg - wi.quota });
    }
    for (const pr of D.periods) {
      if (pr.type !== 'holiday') continue;
      const w = weekStart(pr.start);
      if (!personActiveWeek(p, w)) continue;
      ev.push({ ws: w, amt: holidayActual(p, pr) - Number(pr.quota || 0) });
    }
    for (const a of D.adjustments) if (a.pid === p.id && !a.revoked) ev.push({ ws: weekStart(a.date), amt: Number(a.amount) || 0 });
    per[p.id] = ev;
  }
  ledgerCache = { v: VER, per, wis };
  return ledgerCache;
}
function balanceAt(p, ws) {
  const ev = ledger().per[p.id] || [];
  let b = Number(p.initBalance) || 0;
  for (const e of ev) if (e.ws <= ws) b += e.amt;
  return round1(b);
}
function dayCoverage(date) {
  const t = dayType(date); if (!t) return null;
  const row = D.cells[date] || {};
  let zhu = 0, ye = 0, zhi = 0;
  for (const pid in row) { if (!personById(pid)) continue; const s = row[pid].s; if (s === '主') zhu++; else if (s === '夜') ye++; else if (s === '值') zhi++; }
  const issues = []; let level = null;
  if (t === 'holiday') {
    if (zhi === 0) { issues.push('缺值班'); level = 'red'; } else if (zhi > 1) { issues.push('值×' + zhi); level = 'orange'; }
  } else {
    if (zhu === 0) issues.push('缺主'); if (ye === 0) issues.push('缺夜');
    if (issues.length) level = 'red';
    if (zhu > 1) { issues.push('主×' + zhu); level = level || 'orange'; }

}
function personWeekWarnings(p, wi, s) {

  if (s.nights !== 1) out.push({ level: 'orange', text: s.nights === 0 ? '无夜班' : '夜×' + s.nights });
  if (s.mains !== 1) out.push({ level: 'yellow', text: s.mains === 0 ? '无主班' : '主×' + s.mains });

}
function holidayPeriodsIn(days) { const seen = []; days.forEach(d => { const p = periodOf(d); if (p && p.type === 'holiday' && seen.indexOf(p) < 0) seen.push(p); }); return seen; }
function visiblePeople(wi) {

/* ================= 排班修改 ================= */
function applyShift(date, pid, s) {
  const old = getCell(date, pid) || {};
  const prevS = old.s;
  const cell = Object.assign({}, old);
  delete cell.a;
  if (s) cell.s = s; else delete cell.s;
  setCellRaw(date, pid, cell);
  const next = addDays(date, 1);
  if (prevS === '夜' && s !== '夜') {
    const nc = getCell(next, pid);
    if (nc && nc.s === '下' && nc.a) { const n2 = Object.assign({}, nc); delete n2.s; delete n2.a; setCellRaw(next, pid, n2); }
  }
  if (s === '夜' && dayType(next) !== 'holiday') {
    const nc = getCell(next, pid) || {};
    if (!nc.s) setCellRaw(next, pid, Object.assign({}, nc, { s: '下', a: 1 }));
  }
  commit();
}
function setMark(date, pid, key, val) {
  const cell = Object.assign({}, getCell(date, pid) || {});
  if (val === null) delete cell[key]; else cell[key] = val;
  setCellRaw(date, pid, cell);
  commit();
}

function fixAutoXia(newDays) {

    Object.keys(D.cells[d] || {}).forEach(pid => {
      const c = D.cells[d] && D.cells[d][pid];
      if (!c || c.s !== '下' || !c.a) return;
      const prev = getCell(addDays(d, -1), pid);
      if (!prev || prev.s !== '夜' || dayType(d) === 'holiday') { const n = Object.assign({}, c); delete n.s; delete n.a; setCellRaw(d, pid, n); }
    });
  });
  (newDays || []).forEach(d => {
    if (dayType(d) !== 'regular') return;
    D.people.forEach(p => {
      const prev = getCell(addDays(d, -1), p.id), cur = getCell(d, p.id) || {};
      if (prev && prev.s === '夜' && !cur.s) setCellRaw(d, p.id, Object.assign({}, cur, { s: '下', a: 1 }));
    });
  });
}

function bindDrag(handle, row, list) {
  // 监听挂在 window 上：拖动时行节点会在 DOM 里移动，指针捕获会随之失效
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    const pid = e.pointerId;
    row.classList.add('dragging');
    const move = ev => {
      if (ev.pointerId !== pid) return;
      ev.preventDefault();
      const y = ev.clientY; let before = null;
      for (const r of $$('.prow', list)) { if (r === row) continue; const b = r.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = r; break; } }
      if (before !== row.nextSibling) list.insertBefore(row, before);
    };
    const up = ev => {
      if (ev.pointerId !== pid) return;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      const ids = $$('.prow', list).map(r => r.dataset.id);
      const ordered = ids.map(personById).filter(Boolean);
      const rest = D.people.filter(p => ids.indexOf(p.id) < 0);
      const changed = ordered.some((p, i) => D.people[i] !== p);
      D.people = ordered.concat(rest);
      if (changed) commit();
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ================= 调整加班 ================= */
function openAdjust() {
  const m = openModal({ title: '调整加班', wide: true });
  const draw = () => {
    const res = D.people.filter(p => p.type === 'resident' && !p.sealed);

      '<div class="row" style="background:#f6f8fa;border-radius:10px;padding:8px 10px"><label class="f">统一数量<input type="number" step="0.5" id="adAllN" placeholder="如 -1 或 0.5"></label><label class="f grow">统一原因<input id="adAllR" placeholder="例如：年底清零"></label><button id="adAll">一键应用到所有人</button></div>' +
      '<table class="tbl"><thead><tr><th>姓名</th><th class="num">当前剩余加班</th><th>调整数量</th><th>原因（必填）</th></tr></thead><tbody>' +
      res.map(p => '<tr data-pid="' + p.id + '"><td><b>' + esc(p.name) + '</b></td><td class="num">' + fmtNum(balanceAt(p, weekStart(date))) + '</td><td><input type="number" step="0.5" class="adN" placeholder="0"></td><td><input class="adR" style="width:100%" placeholder="原因"></td></tr>').join('') +
      '</tbody></table>' + (res.length ? '' : '<div class="hint">没有常驻人员</div>') +
      '<div class="err" id="adErr"></div><div class="btns"><button class="primary" id="adOk">确认调整</button></div>' +
      '<div class="sec-t">调整记录</div><div id="adHist"></div>';
    $('#adDate', m.body).onchange = draw;
    $('#adAll', m.body).onclick = () => { const n = $('#adAllN', m.body).value, r = $('#adAllR', m.body).value; $$('tr[data-pid]', m.body).forEach(tr => { $('.adN', tr).value = n; $('.adR', tr).value = r; }); };
    $('#adOk', m.body).onclick = async () => {
      const err = $('#adErr', m.body); err.textContent = '';
      const d = $('#adDate', m.body).value; if (!isValidKey(d)) { err.textContent = '请选择调整日期'; return; }
      const items = [];
      for (const tr of $$('tr[data-pid]', m.body)) {
        const v = $('.adN', tr).value.trim(); if (v === '' || Number(v) === 0) continue;
        const n = Number(v), r = $('.adR', tr).value.trim(), p = personById(tr.dataset.pid);
        if (!isHalfStep(n)) { err.textContent = p.name + '：数量要是 0.5 的倍数'; return; }
        if (!r) { err.textContent = p.name + '：必须填写原因'; return; }
        items.push({ p, n, r });
      }
      if (!items.length) { err.textContent = '请至少给一个人填写调整数量'; return; }
      if (!await confirmBox('确认调整 ' + items.length + ' 人：\n' + items.map(i => i.p.name + '  ' + (i.n > 0 ? '+' : '') + fmtNum(i.n) + '（' + i.r + '）').join('\n'), '确认调整')) return;
      const batch = uid(), now = new Date().toISOString();
      items.forEach(i => D.adjustments.push({ id: uid(), date: d, pid: i.p.id, amount: i.n, reason: i.r, batch, createdAt: now, revoked: false, revokedAt: null }));
      commit(); draw(); toast('已调整 ' + items.length + ' 人');
    };
    drawHist();
  };
  const drawHist = () => {
    const el = $('#adHist', m.body);
    const list = D.adjustments.slice().sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
    if (!list.length) { el.innerHTML = '<div class="hint">还没有调整记录</div>'; return; }
    const batchCount = {}; D.adjustments.forEach(a => { if (!a.revoked) batchCount[a.batch] = (batchCount[a.batch] || 0) + 1; });
    el.innerHTML = '<div class="scroll"><table class="tbl"><thead><tr><th>生效日期</th><th>姓名</th><th class="num">数量</th><th>原因</th><th>操作时间</th><th></th></tr></thead><tbody>' +
      list.map(a => { const p = personById(a.pid); return '<tr class="' + (a.revoked ? 'revoked' : '') + '"><td>' + fmtYMD(a.date) + '</td><td>' + esc(p ? p.name : '(已删除)') + '</td><td class="num">' + (a.amount > 0 ? '+' : '') + fmtNum(a.amount) + '</td><td>' + esc(a.reason) + '</td><td>' + fmtTime(a.createdAt) + '</td>' +
        '<td class="ops" style="text-align:right;white-space:nowrap">' + (a.revoked ? '<span class="muted" style="font-size:12px">已撤销 ' + fmtTime(a.revokedAt) + '</span>' : '<button class="sm" data-rv="' + a.id + '">撤销</button>' + (batchCount[a.batch] > 1 ? ' <button class="sm" data-rvb="' + a.batch + '">撤销整批(' + batchCount[a.batch] + ')</button>' : '')) + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
    $$('[data-rv]', el).forEach(b => b.onclick = async () => {
      const a = D.adjustments.find(x => x.id === b.dataset.rv); const p = personById(a.pid);
      if (!await confirmBox('撤销这条调整？\n' + (p ? p.name : '') + ' ' + (a.amount > 0 ? '+' : '') + fmtNum(a.amount) + '（' + a.reason + '）', '撤销', true)) return;
      a.revoked = true; a.revokedAt = new Date().toISOString(); commit(); draw();
    });
    $$('[data-rvb]', el).forEach(b => b.onclick = async () => {
      const items = D.adjustments.filter(x => x.batch === b.dataset.rvb && !x.revoked);
      if (!await confirmBox('撤销这一批的 ' + items.length + ' 条调整？', '全部撤销', true)) return;
      const now = new Date().toISOString(); items.forEach(a => { a.revoked = true; a.revokedAt = now; }); commit(); draw();
    });
  };
  draw();
}

      '<div class="sec-t">外勤列表（' + D.fieldwork.length + ' 条）</div><div id="fwList"></div><div class="hint">外勤单独记录，不计入加班。</div>';
    $('#fwOk', m.body).onclick = () => {
      const date = $('#fwD', m.body).value, pid = $('#fwP', m.body).value, qty = Number($('input[name=fwQ]:checked', m.body).value), note = $('#fwN', m.body).value.trim();
      if (!isValidKey(date)) { $('#fwE', m.body).textContent = '请选择日期'; return; }
      if (!pid) { $('#fwE', m.body).textContent = '请选择人员'; return; }

      else { D.fieldwork.push({ id: uid(), date, pid, qty, note, createdAt: new Date().toISOString() }); toast('已记录'); }
      commit(); draw();
    };
    if (editing) $('#fwCancel', m.body).onclick = () => { editing = null; draw(); };
    $('#fwBoard', m.body).onclick = openFieldBoard;
    const list = D.fieldwork.slice().sort((a, b) => a.date !== b.date ? (a.date < b.date ? 1 : -1) : (a.createdAt < b.createdAt ? 1 : -1));
    const el = $('#fwList', m.body);
    el.innerHTML = list.length ? '<div class="scroll"><table class="tbl"><thead><tr><th>日期</th><th>人员</th><th class="num">数量</th><th>备注</th><th></th></tr></thead><tbody>' +
      list.map(r => { const p = personById(r.pid); return '<tr><td>' + fmtYMD(r.date) + '</td><td>' + esc(p ? p.name : '(已删除)') + '</td><td class="num">' + fmtNum(r.qty) + '</td><td>' + esc(r.note) + '</td><td style="text-align:right;white-space:nowrap"><button class="sm" data-e="' + r.id + '">修改</button> <button class="sm danger" data-x="' + r.id + '">删除</button></td></tr>'; }).join('') +
      '</tbody></table></div>' : '<div class="hint">还没有外勤记录</div>';
    $$('[data-e]', el).forEach(b => b.onclick = () => { editing = Object.assign({}, D.fieldwork.find(x => x.id === b.dataset.e)); draw(); m.body.scrollTop = 0; });
    $$('[data-x]', el).forEach(b => b.onclick = async () => {
      const r = D.fieldwork.find(x => x.id === b.dataset.x); const p = personById(r.pid);
      if (!await confirmBox('删除这条外勤记录？\n' + fmtYMD(r.date) + ' ' + (p ? p.name : '') + ' ' + fmtNum(r.qty), '删除', true)) return;
      D.fieldwork = D.fieldwork.filter(x => x !== r); if (editing && editing.id === r.id) editing = null; commit(); draw();
    });
  };
  draw();
}

/* ================= 看板 ================= */
function boardPeople(hasData) { return D.people.filter(p => !p.sealed).concat(D.people.filter(p => p.sealed && hasData(p.id))); }
function scheduledCellsIn(a, b, fn) {
  Object.keys(D.cells).sort().forEach(d => { if (d < a || d > b || !dayType(d)) return; const row = D.cells[d]; for (const pid in row) fn(d, pid, row[pid]); });
}
function openBoard(title, calc, defaultRange) {
  const m = openModal({ title, wide: true });
  const r = defaultRange || monthRange(todayKey());
  m.body.innerHTML = rangeControls('bd', r[0], r[1]) + '<div id="bdOut"></div><div class="btns"><button id="bdExp">导出 Excel</button></div>';
  let last = null;
  const run = (a, b) => { last = calc(a, b); $('#bdOut', m.body).innerHTML = boardTableHtml(last); };
  const get = bindRange(m.body, 'bd', run);
  $('#bdExp', m.body).onclick = () => { const [a, b] = get(); if (!last) return; exportBoard(title, a, b, last); };
  run(r[0], r[1]);
}
function boardTableHtml(t) {
  return '<div class="scroll" style="max-height:56vh"><table class="tbl"><thead><tr>' + t.head.map((h, i) => '<th class="' + (t.numCols && t.numCols.indexOf(i) >= 0 ? 'num' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    t.rows.map(r => '<tr>' + r.map((c, i) => '<td class="' + (t.numCols && t.numCols.indexOf(i) >= 0 ? 'num' : '') + (t.smallCols && t.smallCols.indexOf(i) >= 0 ? ' dates' : '') + (c === 0 ? ' muted' : '') + '">' + esc(typeof c === 'number' ? fmtNum(c) : c) + '</td>').join('') + '</tr>').join('') +
    (t.total ? '<tr class="total">' + t.total.map((c, i) => '<td class="' + (t.numCols && t.numCols.indexOf(i) >= 0 ? 'num' : '') + '">' + esc(typeof c === 'number' ? fmtNum(c) : c) + '</td>').join('') + '</tr>' : '') +
    '</tbody></table></div>';
}
function calcNight(a, b) {
  const cnt = {};
  scheduledCellsIn(a, b, (d, pid, c) => { if (c.s === '夜' || c.s === '值') cnt[pid] = (cnt[pid] || 0) + 1; });
  const ppl = boardPeople(id => cnt[id]);
  const rows = ppl.map(p => [p.name + (p.type === 'temp' ? '（临时）' : ''), cnt[p.id] || 0]);
  return { head: ['人员', '夜班数量'], rows, numCols: [1], total: ['合计', rows.reduce((s, r) => s + r[1], 0)], widths: [16, 12], note: '公休假的「值」（全天）也算 1 个夜班' };
}
function calcExam(a, b) {
  const j = {}, x = {}, jn = {}, xn = {};
  const bump = (o, on, pid, note) => { o[pid] = (o[pid] || 0) + 1; if (note) { on[pid] = on[pid] || {}; on[pid][note] = (on[pid][note] || 0) + 1; } };
  scheduledCellsIn(a, b, (d, pid, c) => { if (c.j !== undefined) bump(j, jn, pid, c.j); if (c.x !== undefined) bump(x, xn, pid, c.x); });
  const nt = o => o ? Object.keys(o).map(k => k + '×' + o[k]).join(' ') : '';
  const ppl = boardPeople(id => j[id] || x[id]);
  const rows = ppl.map(p => [p.name + (p.type === 'temp' ? '（临时）' : ''), j[p.id] || 0, nt(jn[p.id]), x[p.id] || 0, nt(xn[p.id])]);
  return { head: ['人员', '教职工体检', '教·备注', '学生体检', '学·备注'], rows, numCols: [1, 3], smallCols: [2, 4], total: ['合计', rows.reduce((s, r) => s + r[1], 0), '', rows.reduce((s, r) => s + r[3], 0), ''], widths: [16, 12, 18, 12, 18] };
}
function calcField(a, b) {
  const sum = {};
  D.fieldwork.forEach(f => { if (f.date >= a && f.date <= b) sum[f.pid] = (sum[f.pid] || 0) + Number(f.qty); });
  const ppl = boardPeople(id => sum[id]);
  const rows = ppl.map(p => [p.name + (p.type === 'temp' ? '（临时）' : ''), round1(sum[p.id] || 0)]);
  const detail = D.fieldwork.filter(f => f.date >= a && f.date <= b).sort((x, y) => x.date < y.date ? -1 : 1).map(f => { const p = personById(f.pid); return [f.date, p ? p.name : '', Number(f.qty), f.note || '']; });
  return { head: ['人员', '外勤数量'], rows, numCols: [1], total: ['合计', round1(rows.reduce((s, r) => s + r[1], 0))], widths: [16, 12], detail: { head: ['日期', '人员', '数量', '备注'], rows: detail, widths: [14, 12, 8, 30] } };
}
function calcLegal(a, b) {
  const st = {};
  scheduledCellsIn(a, b, (d, pid, c) => {
    if (!isLegal(d) || PAY_SHIFTS.indexOf(c.s) < 0) return;
    const o = st[pid] = st[pid] || { n: 0, pay: 0, dates: [] };
    o.n += SHIFT_VALUE[c.s]; o.pay += Number(rateOn(d)[c.s]) || 0; o.dates.push(d);
  });
  const ppl = boardPeople(id => st[id]);
  const rows = ppl.map(p => { const o = st[p.id] || { n: 0, pay: 0, dates: [] }; return [p.name + (p.type === 'temp' ? '（临时）' : ''), o.n, round1(o.pay), o.dates.map(fmtShort).join(' ')]; });
  return { head: ['人员', '加班班次', '加班费(元)', '加班日期'], rows, numCols: [1, 2], smallCols: [3], total: ['合计', rows.reduce((s, r) => s + r[1], 0), round1(rows.reduce((s, r) => s + r[2], 0)), ''], widths: [16, 10, 12, 50] };
}
function openNightBoard() { openBoard('夜班看板', calcNight); }
function openExamBoard() { openBoard('体检看板', calcExam); }
function openFieldBoard() { openBoard('外勤看板', calcField); }
function openLegalBoard() { const y = todayKey().slice(0, 4); openBoard('法定假加班费看板', calcLegal, [y + '-01-01', y + '-12-31']); }

    return fetch('https://api.github.com' + path, Object.assign({}, opts, { headers, cache: 'no-store' }));
  },
  repoPath() { return '/repos/' + encodeURIComponent(this.cfg.owner) + '/' + encodeURIComponent(this.cfg.repo); },
  filePath() { return this.repoPath() + '/contents/' + this.cfg.path.split('/').map(encodeURIComponent).join('/'); },
  async errText(r) {
    let msg = ''; try { msg = (await r.json()).message || ''; } catch (e) { }
    if (r.status === 401) return '令牌无效或已过期，请在「设置」里重新填写';
    if (r.status === 403) return '没有权限：令牌需要这个仓库的 Contents 读写权限' + (msg ? '（' + msg + '）' : '');
    if (r.status === 404) return '找不到仓库，或者令牌没有授权访问这个仓库';
    return 'GitHub 返回错误 ' + r.status + (msg ? '：' + msg : '');
  },
  async fetchRemote() {
    const r = await this.api(this.filePath() + '?ref=' + encodeURIComponent(this.cfg.branch));
    if (r.status === 404) { const rr = await this.api(this.repoPath()); if (!rr.ok) throw new Error(await this.errText(rr)); return { missing: true }; }
    if (!r.ok) throw new Error(await this.errText(r));
    const j = await r.json();
    let text;
    if (j.content && j.encoding === 'base64') text = b64decode(j.content);
    else { const bl = await this.api(this.repoPath() + '/git/blobs/' + j.sha); if (!bl.ok) throw new Error(await this.errText(bl)); text = b64decode((await bl.json()).content); }
    let data; try { data = JSON.parse(text); } catch (e) { throw new Error('云端数据文件格式不对，无法读取'); }
    return { sha: j.sha, data };
  },
  async putRemote(data, sha) {
    const body = { message: '更新排班数据 ' + new Date().toLocaleString('zh-CN', { hour12: false }), content: b64encode(JSON.stringify(data, null, 1)), branch: this.cfg.branch };
    if (sha) body.sha = sha;
    const r = await this.api(this.filePath(), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) return { conflict: true };
    if (!r.ok) throw new Error(await this.errText(r));
    return { sha: (await r.json()).content.sha };
  },
  schedule(ms) { this.renderChip(); if (!this.enabled() || this.conflict) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms || 2500); },
  async run() {
    if (!this.enabled() || this.conflict) { this.renderChip(); return; }
    if (this.busy) { this.again = true; return; }
    clearTimeout(this.timer);
    this.busy = true; this.setState('syncing');
    try {
      if (META.dirty) {
        const revAtStart = LOCAL_REV, snapshot = clone(D);
        let res = await this.putRemote(snapshot, META.sha);
        if (res.conflict) {
          const remote = await this.fetchRemote();
          if (remote.missing) res = await this.putRemote(snapshot, null);
          else if (remote.sha === META.sha) throw new Error('保存到 GitHub 失败，请稍后重试');
          else { this.conflict = remote; this.setState('conflict'); openConflict(); return; }
          if (res.conflict) throw new Error('保存到 GitHub 失败，请稍后重试');
        }
        META.sha = res.sha;
        if (LOCAL_REV === revAtStart) META.dirty = false;
      } else {
        const remote = await this.fetchRemote();
        if (remote.missing) { const res = await this.putRemote(clone(D), null); if (res.conflict) throw new Error('创建云端数据文件失败'); META.sha = res.sha; }
        else if (remote.sha !== META.sha) {
          if (!META.sha || (remote.data.rev || 0) >= (D.rev || 0)) { replaceData(remote.data); META.sha = remote.sha; }
        }
      }
      META.lastSync = Date.now(); lsSet(LS.meta, META); this.err = ''; this.setState('ok');
    } catch (e) {
      this.err = (e && e.message) || String(e);
      if (/Failed to fetch|NetworkError|Load failed|network/i.test(this.err)) this.err = '连不上 GitHub（网络问题），修改已保存在本机，恢复网络后会自动上传';
      lsSet(LS.meta, META); this.setState(navigator.onLine === false ? 'offline' : 'error');
    } finally {
      this.busy = false;
      if (this.again || (META.dirty && this.state === 'ok')) { this.again = false; this.schedule(800); }
    }
  },
  setState(s) { this.state = s; this.renderChip(); },
  renderChip() {
    const el = $('#syncChip'); if (!el) return;
    let cls, txt;
    if (!this.enabled()) { cls = 'grey'; txt = '本地模式'; }
    else if (this.state === 'conflict') { cls = 'red'; txt = '数据冲突'; }
    else if (this.state === 'syncing') { cls = 'blue'; txt = '同步中…'; }
    else if (this.state === 'error') { cls = 'red'; txt = '同步失败'; }
    else if (this.state === 'offline') { cls = 'orange'; txt = '离线·待同步'; }
    else if (META.dirty) { cls = 'orange'; txt = '待同步'; }
    else if (META.lastSync) { cls = 'green'; txt = '已同步 ' + hhmm(META.lastSync); }
    else { cls = 'blue'; txt = '连接中…'; }
    el.className = 'sync-chip ' + cls; el.textContent = '● ' + txt;
  }
};
function dataSummary(d) { return (d.people || []).length + ' 人 · ' + (d.periods || []).length + ' 个排班期间 · 最后修改 ' + fmtTime(d.updatedAt); }
function openConflict() {
  const remote = Sync.conflict; if (!remote) return;
  const m = openModal({ title: '本机和云端的数据不一致' });
  m.body.innerHTML = '<p style="line-height:1.7">本机有还没上传的修改，但云端的数据也被改过了（可能是在另一台设备上改的，或者这台设备第一次连接云端）。请选择保留哪一份：</p>' +
    '<div class="cmp"><div><b>云端数据</b><div class="hint">' + esc(dataSummary(remote.data)) + '</div></div><div><b>本机数据</b><div class="hint">' + esc(dataSummary(D)) + '</div></div></div>' +
    '<div class="btns-col"><button class="primary" data-a="remote">使用云端数据（放弃本机没上传的修改）</button><button data-a="local">使用本机数据（覆盖云端）</button><button data-a="backup">先把本机数据导出备份</button></div>';
  $('[data-a=remote]', m.body).onclick = () => { replaceData(remote.data); META.sha = remote.sha; META.dirty = false; META.lastSync = Date.now(); lsSet(LS.meta, META); Sync.conflict = null; Sync.setState('ok'); m.close(); toast('已使用云端数据'); };
  $('[data-a=local]', m.body).onclick = () => { D.rev = Math.max(D.rev || 0, remote.data.rev || 0) + 1; lsSet(LS.data, D); META.sha = remote.sha; META.dirty = true; lsSet(LS.meta, META); Sync.conflict = null; m.close(); Sync.run(); };
  $('[data-a=backup]', m.body).onclick = exportBackup;
}
function exportBackup() {
  downloadBlob(new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' }), '排班数据备份_' + todayKey() + '.json');
  toast('备份文件已导出');
}
function openSettings() {
  const m = openModal({ title: '设置', wide: false });
  const draw = () => {
    const c = Sync.cfg;
    const status = !Sync.enabled() ? '未连接（数据只保存在这台设备上）' : Sync.state === 'error' || Sync.state === 'offline' ? '同步失败：' + Sync.err : Sync.state === 'conflict' ? '数据冲突，等待你选择' : META.lastSync ? '已连接，上次同步 ' + fmtTime(new Date(META.lastSync).toISOString()) : '已连接';
    m.body.innerHTML = '<div class="sec-t first">云端同步（GitHub）</div>' +
      '<div class="hint" style="color:' + (Sync.state === 'error' ? 'var(--red)' : 'inherit') + '">状态：' + esc(status) + '</div>' +
      '<div class="row"><label class="f">仓库所有者<input id="ghO" value="' + esc(c.owner) + '"></label><label class="f">仓库名<input id="ghR" value="' + esc(c.repo) + '"></label></div>' +
      '<div class="row"><label class="f">分支<input id="ghB" value="' + esc(c.branch) + '" style="width:110px"></label><label class="f">数据文件<input id="ghP" value="' + esc(c.path) + '" style="width:140px"></label></div>' +
      '<div class="row"><label class="f grow">访问令牌<input id="ghT" type="password" autocomplete="off" placeholder="' + (c.token ? '已保存（要更换就粘贴新的）' : '粘贴在 GitHub 生成的令牌') + '"></label></div>' +
      '<div class="btns"><button class="primary" id="ghSave">保存并连接</button>' + (Sync.enabled() ? '<button id="ghNow">立即同步</button><button class="danger" id="ghOff">断开连接</button>' : '') + '</div>' +
      '<details><summary>怎么生成令牌？</summary><ol>' +
      '<li>电脑上登录 GitHub，打开 <b>github.com/settings/personal-access-tokens/new</b></li>' +
      '<li>Token name 随便填，比如「排班平板」；Expiration 选 1 年（到期后回来换一个新的）</li>' +
      '<li>Repository access 选 <b>Only select repositories</b>，只勾选数据仓库 <b>' + esc(c.repo) + '</b></li>' +
      '<li>Permissions → Repository permissions → <b>Contents</b> 改成 <b>Read and write</b></li>' +
      '<li>点 Generate token，复制生成的令牌，粘贴到上面的「访问令牌」</li></ol>' +
      '每台设备第一次使用时粘贴一次。平板丢了，去 GitHub 把这个令牌删掉就行。</details>' +
      '<div class="sec-t">备份</div><div class="hint">连上 GitHub 后，每次保存都会在云端留下历史版本。这里可以另外导出一份备份文件。</div>' +
      '<div class="btns"><button id="bkOut">导出备份文件</button><button id="bkIn">导入备份文件</button><input type="file" id="bkFile" accept=".json,application/json" style="display:none"></div>' +
      '<div class="sec-t">其他</div><div class="row"><label class="f grow">表格标题<input id="stTitle" value="' + esc(D.title) + '"></label><button id="stSave">保存标题</button></div>' +
      '<div class="hint">版本 v' + APP_VERSION + ' · 数据已修改 ' + (D.rev || 0) + ' 次</div>';
    $('#ghSave', m.body).onclick = async () => {
      const n = { owner: $('#ghO', m.body).value.trim(), repo: $('#ghR', m.body).value.trim(), branch: $('#ghB', m.body).value.trim() || 'main', path: $('#ghP', m.body).value.trim() || 'data.json' };
      const tok = $('#ghT', m.body).value.trim();
      if (!n.owner || !n.repo) { toast('请填写仓库所有者和仓库名', true); return; }
      if (!tok && !c.token) { toast('请粘贴访问令牌', true); return; }
      const changedTarget = n.owner !== c.owner || n.repo !== c.repo || n.branch !== c.branch || n.path !== c.path;
      Object.assign(Sync.cfg, n); if (tok) Sync.cfg.token = tok;
      Sync.saveCfg();
      if (changedTarget || tok) { META.sha = null; lsSet(LS.meta, META); }
      Sync.conflict = null;
      await Sync.run();
      draw();
      if (Sync.state === 'ok') toast('已连接 GitHub，数据已同步');
      else if (Sync.state === 'error' || Sync.state === 'offline') toast(Sync.err, true);
    };
    if (Sync.enabled()) {
      $('#ghNow', m.body).onclick = async () => { if (Sync.conflict) { openConflict(); return; } await Sync.run(); draw(); toast(Sync.state === 'ok' ? '同步完成' : Sync.err, Sync.state !== 'ok'); };
      $('#ghOff', m.body).onclick = async () => {
        if (!await confirmBox('断开 GitHub 连接？\n数据仍然保留在这台设备上，只是不再自动同步。' + (META.dirty ? '\n注意：还有修改没上传到云端。' : ''), '断开', true)) return;
        Sync.cfg.token = ''; Sync.saveCfg(); META.sha = null; lsSet(LS.meta, META); Sync.conflict = null; Sync.setState('idle'); draw();
      };
    }
    $('#bkOut', m.body).onclick = exportBackup;
    $('#bkIn', m.body).onclick = () => $('#bkFile', m.body).click();
    $('#bkFile', m.body).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      let data; try { data = JSON.parse(await f.text()); } catch (err) { alertBox('导入失败', '这个文件不是有效的备份文件。'); return; }
      if (!data || !Array.isArray(data.people) || typeof data.cells !== 'object') { alertBox('导入失败', '这个文件不是排班系统的备份文件。'); return; }
      if (!await confirmBox('导入会用备份文件覆盖现在的全部数据。\n备份文件：' + dataSummary(data) + '\n当前数据：' + dataSummary(D) + (Sync.enabled() ? '\n导入后会同步到云端。' : ''), '覆盖导入', true)) return;
      const rev = Math.max(D.rev || 0, data.rev || 0);
      D = normalize(data); D.rev = rev; commit(); toast('导入完成'); draw();
    };
    $('#stSave', m.body).onclick = () => { const t = $('#stTitle', m.body).value.trim(); if (!t) return; D.title = t; commit(); toast('已保存'); };
  };
  draw();
}

/* ================= 启动 ================= */
function onAction(act) {
  ({ schedule: openSchedule, people: openPeople, adjust: openAdjust, field: openField, legal: openLegal, night: openNightBoard, exam: openExamBoard, export: openExport, settings: openSettings })[act]();
}
function init() {
  $$('[data-act]').forEach(b => b.onclick = () => onAction(b.dataset.act));
  $('#prevWeek').onclick = () => gotoWeek(addDays(UI.week, -7));
  $('#nextWeek').onclick = () => gotoWeek(addDays(UI.week, 7));
  $('#thisWeek').onclick = () => gotoWeek(todayKey());
  $('#jumpDate').onchange = e => { if (isValidKey(e.target.value)) gotoWeek(e.target.value); };
  $('#grid').addEventListener('click', onGridClick);
  $('#syncChip').onclick = () => {
    if (!Sync.enabled()) openSettings();
    else if (Sync.conflict) openConflict();
    else if (Sync.state === 'error' || Sync.state === 'offline') alertBox('同步失败', Sync.err + '\n\n可以在「设置」里检查仓库和令牌，或点「立即同步」重试。');
    else Sync.run();
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { const t = topModal(); if (t) t.close(); return; }
    if (topModal() || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'ArrowLeft') gotoWeek(addDays(UI.week, -7));
    if (e.key === 'ArrowRight') gotoWeek(addDays(UI.week, 7));
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.run(); });
  window.addEventListener('online', () => Sync.run());
  setInterval(() => { if (document.visibilityState === 'visible' && !Sync.busy) Sync.run(); }, 90000);
  render();
  if (Sync.enabled()) Sync.run();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
</script>
